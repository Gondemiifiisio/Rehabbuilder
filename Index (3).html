<style>
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f6;margin:0}
header{background:#1e3a5f;color:white;padding:20px}
header h1{margin:0}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:white;border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 3px 10px rgba(0,0,0,0.08)}
.controls{display:flex;flex-wrap:wrap;gap:20px}
label{font-weight:bold}
select,input{padding:8px;margin-top:5px;min-width:200px}
button{background:#2c7be5;color:white;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;margin-right:10px;margin-top:10px}
button:hover{background:#1a68d1}
.exercise{border-bottom:1px solid #eee;padding:15px 0}
.exercise:last-child{border-bottom:none}
.exercise-title{font-weight:bold}
.exercise-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
iframe{width:100%;height:250px;border-radius:6px;border:none}
img{width:100%;border-radius:6px}
.footer{text-align:center;color:#777;font-size:12px;padding:30px}
@media(max-width:900px){.exercise-grid{grid-template-columns:1fr}}
</style>
</head>

<select id="cantidad">

<option>8</option>
<option>10</option>
<option>12</option>
</select>
</div>

</div>

<button onclick="generarRutina()">Generar rutina</button>
<button onclick="window.print()">Exportar / Imprimir</button>

function actualizarPatologias(){

let region=document.getElementById("region").value
let select=document.getElementById("patologia")

select.innerHTML=""

patologiasPorRegion[region].forEach(p=>{

let option=document.createElement("option")
option.text=p
select.add(option)

})

}

function shuffle(arr){
const a=[...arr]
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1))
const tmp=a[i]
a[i]=a[j]
a[j]=tmp
}
return a
}

function generarRutina(){

const patologiaSelect=document.getElementById("patologia")
const patologia=patologiaSelect.value
const cantidad=parseInt(document.getElementById("cantidad").value)
const paciente=document.getElementById("paciente").value

const contenedor=document.getElementById("rutina")
contenedor.innerHTML=""

if(!ejercicios[patologia]){
contenedor.innerHTML="<p>No hay ejercicios cargados para esta patología.</p>"
return
}

let lista=shuffle(ejercicios[patologia])

// evitar pedir más ejercicios de los disponibles
let total=Math.min(cantidad,lista.length)

let html=""

for(let i=0;i<total;i++){
const e=lista[i]

html+=`<div class="exercise">
<div class="exercise-title">${i+1}. ${e.n} – ${e.s}</div>
<div class="exercise-grid">
<img src="${e.img}" loading="lazy">
<iframe src="${e.vid}" allowfullscreen loading="lazy"></iframe>
</div>
</div>`
}

let fecha=new Date().toLocaleDateString()
let titulo=`Rutina – ${patologia}`

if(paciente!==""){
titulo=`${paciente} – ${patologia} (${fecha})`
}

document.getElementById("tituloRutina").innerText=titulo
contenedor.innerHTML=html
}

// inicialización
actualizarPatologias()
document.getElementById("region").addEventListener("change",()=>{
actualizarPatologias()
document.getElementById("rutina").innerHTML=""
})

actualizarPatologias()
document.getElementById("region").addEventListener("change",actualizarPatologias)

</script>
